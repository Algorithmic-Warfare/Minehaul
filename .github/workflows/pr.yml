name: PR Validation

permissions:
  contents: read
  pull-requests: read
  checks: write
  packages: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Detect which paths changed so we skip CI on doc-only / ignore-only PRs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      move: ${{ steps.filter.outputs.move }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            move:
              - 'packages/**'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'integration/game/**'

  # Build and test every Move package under packages/.
  move-contracts:
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.move == 'true'
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version game-env.sh doctor enforces; Homebrew tracks latest.
      - name: Install Sui CLI
        env:
          SUI_VERSION: 1.72.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sui.tgz" \
            "https://github.com/MystenLabs/sui/releases/download/testnet-v${SUI_VERSION}/sui-testnet-v${SUI_VERSION}-ubuntu-x86_64.tgz"
          mkdir -p "$RUNNER_TEMP/sui"
          tar -xzf "$RUNNER_TEMP/sui.tgz" -C "$RUNNER_TEMP/sui"
          sui_bin="$(find "$RUNNER_TEMP/sui" -type f -name sui | head -1)"
          chmod +x "$sui_bin"
          dirname "$sui_bin" >> "$GITHUB_PATH"
          "$sui_bin" --version

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate

      - name: Validate local game harness
        run: |
          bash -n scripts/game-env.sh
          ./scripts/game-env.sh doctor

      - name: Build Move packages
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/Move.toml" ]; then
              echo "::group::Building $dir"
              sui move build --path "$dir" -e testnet
              echo "::endgroup::"
            fi
          done

      - name: Test Move packages
        env:
          SUI_SKIP_SHARED_OBJECTS_VERSION_CHECK: 1
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/Move.toml" ]; then
              echo "::group::Testing $dir"
              sui move test --path "$dir" -e testnet -i 100000000 --force
              echo "::endgroup::"
            fi
          done

      - name: Check compiler-enforced security boundaries
        run: bash scripts/check-security-boundaries.sh

      - name: Run fresh-genesis acceptance matrix
        run: ./scripts/game-env.sh matrix integration/game/scenarios/full-flow.json

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minehaul-acceptance-evidence
          path: |
            .minehaul/game/runtime/
            .minehaul/game/sui.log
          if-no-files-found: warn

      - name: Stop local chain
        if: always()
        run: ./scripts/game-env.sh down || true
